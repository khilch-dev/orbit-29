<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Merch · Orbit 29</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="sky" aria-hidden="true"><span class="sky-twinkles"></span></div>
    <a class="skip" href="#main">Skip to content</a>
    <header class="wrap masthead">
      <a class="wordmark" href="./">
        <span class="orbit" aria-hidden="true"></span>Orbit 29</a
      >
      <nav class="masthead-nav" aria-label="Main navigation">
        <a class="label" href="index.html#tracks">Tracklist</a>
        <a class="label" href="video.html">Video</a>
        <a class="label" href="merch.html" aria-current="page">Merch</a>
        <a class="label" href="artist.html">Artist</a>
      </nav>

    <main id="main" class="wrap subpage" data-enter>
      <h1>Merch</h1>
      <ul class="merch-grid">
        <li>
          <img src="assets/orbit-tee.jpg" alt="Black T-shirt with orange stripes and a ringed planet" width="1000" height="1000" />
          <div class="merch-item">
            <h2>Orbit 29 Tee</h2>
            <span class="label">Sold out</span>
          </div>
        </li>
        <li>
          <img src="assets/orbit-hoodie.jpg" alt="Black hoodie with the album cover printed on the back" width="1000" height="1000" />
          <div class="merch-item">
            <h2>Orbit 29 Hoodie</h2>
            <span class="label">Sold out</span>
          </div>
        </li>
        <li>
          <img src="assets/gold-vinyl.jpg" alt="Gold record beside the Orbit 29 sleeve" width="1000" height="1000" />
          <div class="merch-item">
            <h2>Gold Vinyl</h2>
            <span class="label">Sold out</span>
          </div>
        </li>
        <li>
          <img src="assets/deluxe-vinyl.jpg" alt="Gold and red records beside the Orbit 29 Deluxe sleeve" width="1000" height="1000" />
          <div class="merch-item">
            <h2>Deluxe Vinyl</h2>
            <span class="label">Sold out</span>
          </div>
        </li>
      </ul>
    </main>

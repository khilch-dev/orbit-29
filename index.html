<!doctype html>
<html lang="en" data-type="product">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Orbit 29" />
    <meta name="page-type" content="product" />
    <meta name="site-kind" content="other" />
    <meta name="theme-color" content="#1f1b1a" />
    <title>orbit 29</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="tracks.js"></script>
    <script defer src="player.js"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="sky-twinkles"></span>
      <div class="sky-void"><span class="sky-saturn"></span></div>
      <div class="sky-restoration">
        <div class="sky-streaks">
          <span style="--lane: 11%; --length: 120px; --speed: 3.8s; --phase: -1.1s"></span>
          <span style="--lane: 18%; --length: 68px; --speed: 4.5s; --phase: -3.1s"></span>
          <span style="--lane: 29%; --length: 155px; --speed: 3.1s; --phase: -2.4s"></span>
          <span style="--lane: 38%; --length: 88px; --speed: 4.1s; --phase: -1.3s"></span>
          <span style="--lane: 49%; --length: 114px; --speed: 3.7s; --phase: -2.8s"></span>
          <span style="--lane: 57%; --length: 172px; --speed: 3.3s; --phase: -0.5s"></span>
          <span style="--lane: 68%; --length: 73px; --speed: 4.2s; --phase: -1.6s"></span>
          <span style="--lane: 76%; --length: 132px; --speed: 3.6s; --phase: -2.2s"></span>
          <span style="--lane: 85%; --length: 99px; --speed: 4.4s; --phase: -3.4s"></span>
        </div>
      </div>
      <div class="sky-jazz"><span class="jazz-record"></span></div>
      <div class="sky-wizard">
        <div class="wizard-black-hole"></div>
      </div>
    </div>
    <a class="skip" href="#main">Skip to album</a>
    <header class="wrap masthead">
      <a class="wordmark" href="./">
        <span class="orbit" aria-hidden="true"></span>Orbit 29</a
      >
      <nav class="masthead-nav" aria-label="Main navigation">
        <a class="label" href="#tracks">Tracklist</a>
        <a class="label" href="video.html">Video</a>
        <a class="label" href="merch.html">Merch</a>
        <a class="label" href="artist.html">Artist</a>
      </nav>
    </header>
    <main id="main" class="wrap layout" data-enter>
      <img
        class="cover"
        src="assets/orbit_29.png"
        width="1368"
        height="1370"
        alt="2 people sit at beach in space"
      />
      <section class="album" aria-labelledby="title">
        <p class="eyebrow"><span></span>mark truckerburg</p>
        <h1 id="title">Orbit <em>29</em></h1>
        <div class="track-head" id="tracks">
          <h2>Disc A</h2>
          <span id="edition" class="label"></span>
        </div>
        <ol id="tracklist"></ol>
        <noscript>Enable JavaScript to use the album player.</noscript>
      </section>
    </main>
    <footer class="deck">
      <div class="wrap console">
        <div class="now">
          <img src="assets/orbit_29.png" alt="" width="48" height="48" />
          <div>
            <span class="label">Now playing</span
            ><strong id="current">Select a track</strong>
          </div>
        </div>
        <div class="transport">
          <button id="previous" aria-label="Previous track">❮</button>
          <button id="toggle" class="play" aria-label="Play">▶</button>
          <button id="next" aria-label="Next track">❯</button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span
          ><input
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0"
            disabled
            aria-label="Playback position"
          /><span id="duration">0:00</span>
        </div>
        <label class="volume">
          <span class="label" aria-hidden="true">Vol</span>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume" />
        </label>
        <p id="status" role="status" hidden></p>
        <audio id="audio" preload="metadata"></audio>
      </div>
    </footer>
  </body>
</html>

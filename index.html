<!doctype html>
<html lang="en" data-type="product">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Orbit 29"
    />
    <meta name="page-type" content="product" />
    <meta name="site-kind" content="other" />
    <meta name="theme-color" content="#1f1b1a" />
    <title>Orbit 29</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="tracks.js"></script>
    <script defer src="player.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to album</a>
    <header class="wrap masthead">
      <a class="wordmark" href="./"
        ><span class="orbit" aria-hidden="true"></span>Orbit 29</a
      >
      <a class="label" href="#tracks">Tracklist</a>
    </header>
    <main id="main" class="wrap layout" data-enter>
      <img
        class="cover"
        src="assets/cover.jpg"
        width="1368"
        height="1370"
        alt="Orbit 29 cover art, with Saturn above two people lounging on a golden beach."
      />
      <section class="album" aria-labelledby="title">
        <p class="eyebrow"><span></span> Album listening room</p>
        <h1 id="title">Orbit <em>29</em></h1>
        <div class="track-head" id="tracks">
          <h2>Tracklist</h2>
          <span id="edition" class="label"></span>
        </div>
        <ol id="tracklist"></ol>
        <noscript>Enable JavaScript to use the album player.</noscript>
      </section>
    </main>
    <footer class="deck">
      <div class="wrap console">
        <div class="now">
          <img src="assets/cover.jpg" alt="" width="48" height="48" />
          <div>
            <span class="label">Now playing</span
            ><strong id="current">Select a track</strong>
          </div>
        </div>
        <div class="transport">
          <button id="previous" aria-label="Previous track">❮</button>
          <button id="toggle" class="play" aria-label="Play">▶</button>
          <button id="next" aria-label="Next track">❯</button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span
          ><input
            id="seek"
            type="range"
            min="0"
            max="1000"
            value="0"
            disabled
            aria-label="Playback position"
          /><span id="duration">0:00</span>
        </div>
        <p id="status" role="status" hidden></p>
        <audio id="audio" preload="metadata"></audio>
      </div>
    </footer>
  </body>
</html>
